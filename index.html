<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f2e9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="習慣打卡">
<meta name="description" content="每天打卡、看見自己連續了多久的小工具">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>習慣打卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ====== 顏色（想換色改這裡） ====== */
:root{
  --bg:#f7f2e9;        /* 米色底 */
  --card:#ffffff;
  --text:#3b342e;      /* 深咖啡字 */
  --muted:#8a7f72;
  --line:#e9e0d1;
  --orange:#e0702f;    /* 重點橘 */
  --orange-soft:#fbeadf;
  --mustard-soft:#fbf1d8;
  --navy:#3d5a6c;      /* 底部導覽列 */
  --danger:#c0453a;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:16px;line-height:1.6;letter-spacing:.02em;
  padding:calc(8px + var(--safe-t)) 0 calc(90px + var(--safe-b));overflow-x:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- 頁首 ---------- */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--muted)}
.title{font-size:26px;font-weight:900;line-height:1.35;margin:0 0 4px}
.title em,.subtitle em{font-style:normal;color:var(--orange)}
.subtitle{font-size:15px;color:var(--muted);font-weight:700;margin:-2px 0 4px}
.del-sm{display:flex;align-items:center;gap:3px;font-size:12px;color:#b3a796;padding:4px 2px}
.datenav{display:flex;align-items:center;gap:6px;margin-top:10px}
.datenav button{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;color:var(--muted)}
.datenav button:disabled{opacity:.35}
.datenav .back{width:auto;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--orange);background:var(--orange-soft)}
svg.i{width:20px;height:20px;flex:0 0 auto}

/* ---------- 卡片 ---------- */
.card{background:var(--card);border-radius:20px;padding:12px 14px;margin:12px 0;box-shadow:0 2px 12px rgba(110,85,50,.06)}
.cat-h{display:flex;align-items:center;gap:8px;font-weight:900;font-size:16px}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.tag{margin-left:auto;font-size:11.5px;font-weight:700;border-radius:6px;padding:0 7px;white-space:nowrap}
.hint{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:#6d6154;margin:10px 0;padding:8px 12px;background:var(--mustard-soft);border-radius:12px}

/* 打卡方塊 */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.hb{display:flex;align-items:center;gap:8px;border-radius:14px;padding:11px 12px;font-size:15px;font-weight:700;background:var(--bg);text-align:left;min-height:48px;transition:background .15s,transform .1s}
.hb:active{transform:scale(.97)}
.hb span:last-child{min-width:0;overflow-wrap:anywhere}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid #d6c8b2;display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:#fff}
.ck svg{width:15px;height:15px;opacity:0}
.hb.on{background:var(--cs)}
.hb.on .ck{background:var(--c);border-color:var(--c)}
.hb.on .ck svg{opacity:1}
.hb.arch{opacity:.6}

/* 右下角新增鈕 */
.fab{position:fixed;z-index:40;right:max(16px,calc(50% - 264px));bottom:calc(84px + var(--safe-b));width:56px;height:56px;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(224,112,47,.35)}
.fab svg{width:28px;height:28px}
.fab.hide{display:none}

/* ---------- 底部分頁 ---------- */
.tabbar{position:fixed;z-index:50;left:0;right:0;bottom:0;display:flex;background:var(--navy);box-shadow:0 -2px 12px rgba(40,50,60,.15);padding:6px 6px calc(6px + var(--safe-b))}
.tabbar button{flex:1;max-width:120px;margin:0 auto;border-radius:14px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:1px;color:#b9cad4;font-size:11.5px;font-weight:700}
.tabbar svg{width:24px;height:24px}
.tabbar button.on{color:#ffb07a;background:rgba(255,255,255,.1)}

/* ---------- 檢視 ---------- */
.pills{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:#fff;border-radius:20px;padding:5px;margin:12px 0 0;box-shadow:0 3px 14px rgba(110,85,50,.07)}
.pills::-webkit-scrollbar{display:none}
.pills button{flex:1 0 auto;min-width:64px;padding:6px 12px;border-radius:14px;font-size:14px;font-weight:900;white-space:nowrap;color:var(--muted)}
.seg{display:flex;background:#efe8dc;border-radius:12px;padding:3px;margin:10px 0 0}
.seg button{flex:1;padding:5px;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--text)}
.mnav{display:flex;justify-content:space-between;align-items:center;font-weight:900;margin-bottom:8px}
.mnav button{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.mnav button:disabled{opacity:.3}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px;font-weight:700}
.cal .wd{font-size:11px;color:var(--muted)}
.cal button{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--muted);font-weight:700}
.cal button.today{outline:2px solid var(--orange);outline-offset:-2px}
.cal button.fut{opacity:.35;cursor:default}
.stats{display:flex;gap:8px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--muted)}
.stats div{flex:1}
.stats b{font-size:22px;font-weight:900;color:var(--text);margin-right:2px}
.heat-wrap{overflow:hidden}
.chips.sub{margin-top:10px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.chips.sub::-webkit-scrollbar{display:none}
.chips.sub .chip{flex:0 0 auto;font-size:13px;padding:3px 12px}
.heat-m,.heat{display:grid;grid-auto-flow:column}
.heat{grid-template-rows:repeat(7,auto)}
.heat-m{font-size:10.5px;color:var(--muted);font-weight:700;margin-bottom:3px;height:16px}
.heat-m span{white-space:nowrap;overflow:visible}
.heat button{aspect-ratio:1;border-radius:3px;background:#f1ebe0}
.heat button.fut{background:transparent;cursor:default}
.heat button.today{outline:1.5px solid var(--orange)}
.legend{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* ---------- 目標 ---------- */
.bar{height:8px;border-radius:4px;background:#f1ebe0;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;text-align:center;font-size:11px;color:var(--muted);font-weight:700}
.wk span{display:block;height:24px;border-radius:8px;background:var(--bg);margin-top:2px}
.wk.mo{grid-template-columns:repeat(7,1fr)}
.wk.mo span{height:26px;margin:0;display:flex;align-items:center;justify-content:center;font-size:11px}
.wk.mo span.fut{border:0;background:none;color:#d6c8b2}
.wk span.fut{background:none;border:2px dashed #e0d5c2}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.foot .tag{margin-left:0}

/* ---------- 習慣管理 ---------- */
.row{display:flex;align-items:center;gap:10px;width:100%;padding:11px 2px;border-top:1px dashed var(--line);text-align:left;font-size:15px}
.row:first-of-type{border-top:0}
.row .chev{margin-left:auto;color:#c9bca8}
.row small{color:var(--muted);font-size:12px}
.fold{display:block;width:100%;text-align:left}
.fold .chev{display:flex;color:#c9bca8;transition:transform .2s}
.fold .chev.up{transform:rotate(180deg)}
.add-line svg.i{width:18px;height:18px}
.edit{margin-left:auto;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--muted)}
.add-line{display:flex;align-items:center;gap:6px;color:var(--orange);font-weight:700;font-size:14px;padding:10px 2px 2px}
.add-line svg{width:18px;height:18px}
.section-t{font-size:17px;font-weight:900;margin:22px 0 4px;display:flex;align-items:center}
.section-t:after{content:"";flex:1;border-top:1px dashed var(--line);margin-left:10px}

/* ---------- 按鈕 ---------- */
.btn{display:block;width:100%;border-radius:999px;text-align:center;font-weight:900;padding:12px;font-size:15px;background:var(--orange);color:#fff}
.btn.ghost{background:var(--bg);color:var(--text)}
.btn.danger{background:none;color:var(--danger);font-weight:700;padding:8px}
.btns{display:flex;gap:8px}
.btns .btn{flex:1}

/* ---------- 底部滑出面板 ---------- */
.mask{position:fixed;inset:0;z-index:60;background:rgba(40,32,24,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:61;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#fff;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + var(--safe-b));max-height:88vh;overflow-y:auto;transform:translateY(105%);transition:transform .25s ease}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:19px;font-weight:900;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.lbl{font-size:13px;font-weight:700;margin:12px 0 6px}
.inp{width:100%;background:var(--bg);border:2px solid transparent;border-radius:14px;padding:10px 14px;font-size:16px;outline:none}
.inp:focus{border-color:#f0c4a6}
.err{font-size:13px;color:var(--danger);margin-top:6px;min-height:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;background:var(--bg);border:2px solid transparent}
.chip.new{background:none;border:1.5px dashed #d6c8b2;color:var(--muted)}
.sw{display:flex;flex-wrap:wrap;gap:12px}
.sw button{width:36px;height:36px;border-radius:50%}
.sw button.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--c)}
.opt{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:14px;background:var(--bg);margin:6px 0;font-weight:700;font-size:15px;text-align:left;border:2px solid transparent}
.rd{width:20px;height:20px;border-radius:50%;border:2px solid #d6c8b2;flex:0 0 auto}
.opt.on .rd{border:6px solid var(--c)}
.stp{display:flex;align-items:center;justify-content:center;gap:22px;margin:10px 0 4px}
.stp button{width:44px;height:44px;border-radius:50%;background:var(--orange-soft);color:var(--orange);display:flex;align-items:center;justify-content:center}
.stp b{font-size:36px;font-weight:900;min-width:30px;text-align:center}

/* 提示訊息 */
.toast{position:fixed;z-index:80;left:50%;bottom:calc(100px + var(--safe-b));transform:translate(-50%,20px);background:var(--text);color:#fff;font-size:14px;padding:8px 16px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:28px 10px}
.empty p{color:var(--muted);font-size:14px;margin:4px 0 14px}
</style>
</head>
<body>

<main class="wrap">
  <section id="v-today" class="view on"></section>
  <section id="v-goals" class="view"></section>
  <section id="v-review" class="view"></section>
  <section id="v-habits" class="view"></section>
</main>

<button class="fab" id="fab" aria-label="新增習慣" onclick="openHabitSheet()"></button>

<nav class="tabbar">
  <button data-tab="today" class="on" onclick="showTab('today')"><span data-icon="check"></span>打卡</button>
  <button data-tab="goals" onclick="showTab('goals')"><span data-icon="target"></span>目標</button>
  <button data-tab="review" onclick="showTab('review')"><span data-icon="cal"></span>檢視</button>
  <button data-tab="habits" onclick="showTab('habits')"><span data-icon="list"></span>習慣</button>
</nav>

<div class="mask" id="mask" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
/* =========================================================
   習慣打卡｜資料只存在這支手機的瀏覽器裡
   ========================================================= */

/* ---------- 可以自己改的設定 ---------- */
// 新增類別時可以挑的顏色（想換色改這裡）
const PALETTE = ['#8cbf63','#e0702f','#7cc3c8','#8f7fc6','#e3b23c','#e58fa0','#3d5a6c','#a67c52'];
// 第一次打開時預設的類別與習慣（之後都可以在「習慣」分頁修改）
// goal 的寫法：{freq:'daily'} 每天、{freq:'weekly', n:3} 每週 3 次、{freq:'monthly', n:10} 每月 10 次
const STARTER = [
  { name:'運動', color:'#8cbf63', goal:{freq:'weekly', n:3}, habits:['騎腳踏車','瑜伽','跑步'] },
  { name:'學習', color:'#8f7fc6', goal:{freq:'daily'},       habits:['閱讀','英文練習','AI 工具'] },
  { name:'財務管理', color:'#e0702f', goal:{freq:'daily'},   habits:['記帳'] },
];

/* ---------- 資料存取（請勿改 KEY，改了會讀不到舊資料） ---------- */
const KEY = 'habit-tracker-data';
const DATA_VERSION = 2;
let S;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function seed(){
  const d = { version:DATA_VERSION, categories:[], habits:[], goals:[], logs:{} };
  STARTER.forEach(c => {
    const id = uid();
    d.categories.push({ id, name:c.name, color:c.color });
    c.habits.forEach(h => d.habits.push({ id:uid(), name:h, catId:id, archived:false }));
    if (c.goal) d.goals.push({ id:uid(), type:'cat', target:id, freq:c.goal.freq, n:c.goal.n || 7 });
  });
  return d;
}
// 未來資料格式有變動時，在這裡把舊格式轉成新格式，舊資料就不會遺失
function migrate(d){
  if (!d || typeof d !== 'object') throw new Error('bad data');
  d.version = d.version || 1;
  d.categories = Array.isArray(d.categories) ? d.categories : [];
  d.habits = Array.isArray(d.habits) ? d.habits : [];
  d.logs = (d.logs && typeof d.logs === 'object') ? d.logs : {};
  d.habits.forEach(h => { h.archived = !!h.archived; });
  // 第 1 版：目標寫在類別裡 → 第 2 版：目標獨立成一份清單（可以是類別，也可以是單一習慣）
  if (d.version < 2) {
    d.goals = [];
    d.categories.forEach(c => {
      if (c.goal && (c.goal.type === 'daily' || c.goal.type === 'weekly'))
        d.goals.push({ id:uid(), type:'cat', target:c.id, freq:c.goal.type, n:c.goal.n || 7 });
      delete c.goal;
    });
    d.version = 2;
  }
  d.goals = Array.isArray(d.goals) ? d.goals : [];
  // if (d.version < 3) { ...下一次改格式時寫在這裡... ; d.version = 3; }
  return d;
}
function load(){
  const raw = localStorage.getItem(KEY);
  if (!raw) return seed();
  try { return migrate(JSON.parse(raw)); }
  catch(e){
    localStorage.setItem(KEY + '-broken-' + Date.now(), raw); // 讀不懂的資料另外留一份，不直接覆蓋
    return seed();
  }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('儲存失敗，手機空間可能不足'); }
}

/* ---------- 日期工具（一週從週一開始） ---------- */
const pad = n => String(n).padStart(2,'0');
const dk = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addD = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const weekStart = d => addD(new Date(d.getFullYear(), d.getMonth(), d.getDate()), -((d.getDay()+6)%7));
const WD = ['日','一','二','三','四','五','六'];
const md = d => `${d.getMonth()+1}/${d.getDate()}`;

/* ---------- 顏色工具 ---------- */
function mix(hex, to, t){
  const a = hex.match(/\w\w/g).map(x=>parseInt(x,16)), b = to.match(/\w\w/g).map(x=>parseInt(x,16));
  return '#' + a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,'0')).join('');
}
const soft = c => mix(c, '#ffffff', .82);
const ink  = c => mix(c, '#000000', .38);
const onColor = c => { const [r,g,b] = c.match(/\w\w/g).map(x=>parseInt(x,16)); return (r*.299+g*.587+b*.114) > 175 ? ink(c) : '#fff'; };

/* ---------- 查詢與計算 ---------- */
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const habit = id => S.habits.find(h => h.id === id);
const cat = id => S.categories.find(c => c.id === id);
const habitsOf = (cid, withArchived) => S.habits.filter(h => h.catId === cid && (withArchived || !h.archived));
const isDone = (hid, k) => (S.logs[k] || []).includes(hid);
// 某天這個類別有沒有做到（任一項目都算；習慣換類別時紀錄會跟著搬）
const catDone = (cid, k) => (S.logs[k] || []).some(id => { const h = habit(id); return h && h.catId === cid; });

function toggle(hid, k){
  const a = S.logs[k] || (S.logs[k] = []);
  const i = a.indexOf(hid);
  if (i > -1) a.splice(i,1); else { a.push(hid); if (navigator.vibrate) navigator.vibrate(8); }
  if (!a.length) delete S.logs[k];
  save();
}
/* 「對象」可以是整個類別（tp='cat'）或單一習慣（tp='habit'） */
const doneOn = (tp, id, k) => tp === 'cat' ? catDone(id,k) : isDone(id,k);
const monthStart = d => new Date(d.getFullYear(), d.getMonth(), 1);
const monthDays = d => new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
const prevMonth = d => new Date(d.getFullYear(), d.getMonth()-1, 1);
// 從 start 開始的 days 天裡，有幾天做到（未來的日子不算）
function countRange(tp, id, start, days){
  let n = 0; const t = today();
  for (let i = 0; i < days; i++){ const d = addD(start,i); if (d > t) break; if (doneOn(tp,id,dk(d))) n++; }
  return n;
}
const weekCount = (cid, ws) => countRange('cat', cid, ws, 7);
// 連續天數：今天還沒做不算中斷，從昨天往回數
function dayStreak(tp, id){
  let d = today(); if (!doneOn(tp,id,dk(d))) d = addD(d,-1);
  let n = 0; while (doneOn(tp,id,dk(d))) { n++; d = addD(d,-1); }
  return n;
}
// 連續達標週數／月數：這一期已達標就算進去，還沒達標就從上一期往回數
function weekStreak(tp, id, n){
  let ws = weekStart(today()), c = 0;
  if (countRange(tp,id,ws,7) >= n) c++;
  ws = addD(ws,-7);
  while (countRange(tp,id,ws,7) >= n) { c++; ws = addD(ws,-7); }
  return c;
}
function monthStreak(tp, id, n){
  let m = monthStart(today()), c = 0;
  if (countRange(tp,id,m,monthDays(m)) >= n) c++;
  m = prevMonth(m);
  while (countRange(tp,id,m,monthDays(m)) >= n) { c++; m = prevMonth(m); }
  return c;
}
function longestDays(tp, id){
  const ds = Object.keys(S.logs).filter(k => doneOn(tp,id,k)).sort();
  let best = 0, cur = 0, prev = null;
  ds.forEach(k => { cur = (prev && dk(addD(pd(prev),1)) === k) ? cur+1 : 1; best = Math.max(best,cur); prev = k; });
  return best;
}

/* ---------- 目標 ---------- */
const goalOf = (tp, id) => S.goals.find(g => g.type === tp && g.target === id);
const goalN = g => g.freq === 'daily' ? 7 : g.n;
const goalText = g => g.freq === 'daily' ? '每天' : g.freq === 'weekly' ? `每週 ${g.n} 次` : `每月 ${g.n} 次`;
const goalName = g => g.type === 'cat' ? cat(g.target).name : habit(g.target).name;
const goalColor = g => cat(g.type === 'cat' ? g.target : habit(g.target).catId).color;
// 這一期：每天、每週的目標看本週；每月的目標看本月
function goalPeriod(g){
  const t = today();
  return g.freq === 'monthly' ? { start:monthStart(t), days:monthDays(t), label:'本月' } : { start:weekStart(t), days:7, label:'本週' };
}
const goalCount = g => { const p = goalPeriod(g); return countRange(g.type, g.target, p.start, p.days); };
function streakOf(g){
  if (g.freq === 'weekly')  { const s = weekStreak(g.type, g.target, g.n);  return s ? `連續 ${s} 週達標` : ''; }
  if (g.freq === 'monthly') { const s = monthStreak(g.type, g.target, g.n); return s ? `連續 ${s} 個月達標` : ''; }
  const s = dayStreak(g.type, g.target); return s ? `連續 ${s} 天` : '';
}

/* ---------- 共用：打卡方塊 ---------- */
function tile(h, k){
  const c = cat(h.catId);
  return `<button class="hb ${isDone(h.id,k)?'on':''} ${h.archived?'arch':''}" style="--c:${c.color};--cs:${soft(c.color)}"
    onclick="tapHabit('${h.id}','${k}',this)"><span class="ck">${ICON.tick}</span><span>${esc(h.name)}</span></button>`;
}
function tapHabit(hid, k, el){
  toggle(hid, k);
  el.classList.toggle('on', isDone(hid,k));
  render(true);
}

/* =========================================================
   分頁 1：打卡
   ========================================================= */
let viewDate = today();
function shiftDate(n){ const d = addD(viewDate, n); if (d > today()) return; viewDate = d; render(); }

function renderToday(){
  const k = dk(viewDate), isToday = k === dk(today());
  const total = (S.logs[k] || []).filter(id => habit(id)).length;
  let h = `<div class="eyebrow">${viewDate.getMonth()+1} / ${pad(viewDate.getDate())} 週${WD[viewDate.getDay()]}</div>
    <h1 class="title">${isToday?'今日打卡':'補記打卡'}</h1>
    <div class="subtitle">${isToday?'今天':'這天'}已完成 <em>${total}</em> 個習慣</div>
    <div class="datenav">
      <button aria-label="前一天" onclick="shiftDate(-1)">${ICON.left}</button>
      <button aria-label="後一天" onclick="shiftDate(1)" ${isToday?'disabled':''}>${ICON.right}</button>
      ${isToday ? '<span class="hint">往前翻可以補記</span>' : `<button class="back" onclick="viewDate=today();render()">回到今天</button>`}
    </div>`;
  if (!S.categories.length) {
    h += `<div class="card empty"><b>先建立第一個類別</b><p>例如「運動」，再把騎車、瑜伽放進去。</p>
      <button class="btn" onclick="openCatSheet()">新增類別</button></div>`;
  }
  S.categories.forEach(c => {
    const hs = habitsOf(c.id);
    if (!hs.length) return;
    let tag = '', done = true;
    const g = goalOf('cat', c.id);
    if (isToday) {
      if (!g) tag = `本週 ${weekCount(c.id, weekStart(today()))} 天`;
      else if (g.freq === 'daily') { const s = dayStreak('cat', c.id); tag = s ? `連續 ${s} 天` : '今天還沒做'; done = s > 0; }
      else { const n = goalCount(g); tag = `${goalPeriod(g).label} ${n} / ${g.n}${n >= g.n ? '・達標' : ''}`; }
    } else { done = catDone(c.id,k); tag = done ? '這天有做' : '這天沒做'; }
    h += `<div class="card"><div class="cat-h"><span class="dot" style="background:${c.color}"></span>${esc(c.name)}
      <span class="tag" style="background:${done?soft(c.color):'var(--bg)'};color:${done?ink(c.color):'var(--muted)'}">${tag}</span></div>
      <div class="grid">${hs.map(x => tile(x,k)).join('')}</div></div>`;
  });
  if (S.categories.length && !S.habits.some(x => !x.archived)) {
    h += `<div class="card empty"><b>還沒有習慣</b><p>按右下角的 ＋ 新增第一個習慣。</p></div>`;
  }
  document.getElementById('v-today').innerHTML = h;
}

/* =========================================================
   分頁 2：檢視（月曆／半年／一年）
   ========================================================= */
// habit 是 null 時看整個類別；選了某個習慣就只看那個習慣
const RV = { cat:null, habit:null, range:'month', month:new Date(today().getFullYear(), today().getMonth(), 1) };

function renderReview(){
  const el = document.getElementById('v-review');
  if (!S.categories.length) { el.innerHTML = `<h1 class="title" style="margin-top:6px">回顧我的好習慣</h1><div class="card empty"><p>建立類別、開始打卡後，這裡會出現你的紀錄。</p></div>`; return; }
  if (!cat(RV.cat)) RV.cat = S.categories[0].id;
  const c = cat(RV.cat);
  const hs = habitsOf(c.id, true).filter(x => !x.archived || Object.values(S.logs).some(a => a.includes(x.id)));
  if (RV.habit && !hs.some(x => x.id === RV.habit)) RV.habit = null;
  const tp = RV.habit ? 'habit' : 'cat', tid = RV.habit || c.id;
  const done = k => doneOn(tp, tid, k);
  let h = `<h1 class="title" style="margin-top:6px">回顧我的好習慣</h1>
    <div class="pills">${S.categories.map(x => `<button onclick="RV.cat='${x.id}';RV.habit=null;render()" style="${x.id===c.id?`background:${soft(x.color)};color:${ink(x.color)}`:''}">${esc(x.name)}</button>`).join('')}</div>
    ${hs.length > 1 ? `<div class="chips sub">${[{id:null,name:'全部'}, ...hs].map(x => `<button class="chip" onclick="RV.habit=${x.id?`'${x.id}'`:'null'};render()"
      style="${RV.habit===x.id?`background:${soft(c.color)};border-color:${c.color};color:${ink(c.color)}`:'background:#fff'}">${esc(x.name)}</button>`).join('')}</div>` : ''}
    <div class="card">`;
  let doneInRange = 0, rangeLabel;
  const t = today();

  if (RV.range === 'month') {
    const y = RV.month.getFullYear(), m = RV.month.getMonth();
    const first = new Date(y,m,1), days = new Date(y,m+1,0).getDate(), off = (first.getDay()+6)%7;
    const isCur = y === t.getFullYear() && m === t.getMonth();
    h += `<div class="mnav"><button aria-label="上個月" onclick="RV.month=new Date(${y},${m-1},1);render()">${ICON.left}</button>${y} 年 ${m+1} 月
      <button aria-label="下個月" onclick="RV.month=new Date(${y},${m+1},1);render()" ${isCur?'disabled':''}>${ICON.right}</button></div>
      <div class="cal">${['一','二','三','四','五','六','日'].map(w=>`<div class="wd">${w}</div>`).join('')}${'<div></div>'.repeat(off)}`;
    for (let d = 1; d <= days; d++) {
      const dt = new Date(y,m,d), k = dk(dt), fut = dt > t, on = !fut && done(k);
      if (on) doneInRange++;
      h += `<button class="${fut?'fut':''} ${k===dk(t)?'today':''}" style="${on?`background:${c.color};color:${onColor(c.color)}`:''}" ${fut?'disabled':`onclick="openDaySheet('${k}')"`}>${d}</button>`;
    }
    h += `</div>`;
    rangeLabel = '這個月完成';
  } else {
    const weeks = RV.range === 'half' ? 26 : 53;
    const ws0 = addD(weekStart(t), -(weeks-1)*7);
    const gap = RV.range === 'half' ? 3 : 2;
    let months = '', cells = '';
    for (let w = 0; w < weeks; w++) {
      const ws = addD(ws0, w*7);
      let label = '';
      for (let i = 0; i < 7; i++) {
        const dt = addD(ws,i), k = dk(dt), fut = dt > t, on = !fut && done(k);
        if (dt.getDate() === 1 && w < weeks - 2) label = RV.range === 'year' ? `${dt.getMonth()+1}` : `${dt.getMonth()+1}月`;
        if (on) doneInRange++;
        cells += `<button class="${fut?'fut':''} ${k===dk(t)?'today':''}" style="${on?`background:${c.color}`:''}" aria-label="${k}" ${fut?'disabled':`onclick="openDaySheet('${k}')"`}></button>`;
      }
      if (w === 0 && !label) label = RV.range === 'year' ? `${ws.getMonth()+1}` : `${ws.getMonth()+1}月`;
      months += `<span>${label}</span>`;
    }
    const cols = `grid-template-columns:repeat(${weeks},minmax(0,1fr));column-gap:${gap}px`;
    h += `<div class="heat-wrap"><div class="heat-m" style="${cols}">${months}</div>
      <div class="heat" style="${cols};row-gap:${gap}px">${cells}</div></div>
      <div class="legend">${RV.range === 'year' ? '上方數字是月份，' : ''}每一直排是一週（上週一、下週日）<span style="margin-left:auto"></span><i style="background:#f1ebe0"></i>沒做<i style="background:${c.color}"></i>有做</div>`;
    rangeLabel = RV.range === 'half' ? '近半年完成' : '近一年完成';
  }
  // 有設每週／每月目標的，顯示連續達標幾週／幾個月；其他顯示連續幾天
  const g = goalOf(tp, tid);
  const cur = g && g.freq === 'weekly' ? ['連續達標', weekStreak(tp,tid,g.n), '週']
    : g && g.freq === 'monthly' ? ['連續達標', monthStreak(tp,tid,g.n), '個月'] : ['目前連續', dayStreak(tp,tid), '天'];
  h += `<div class="stats"><div>${cur[0]}<br><b>${cur[1]}</b>${cur[2]}</div>
    <div>${rangeLabel}<br><b>${doneInRange}</b>天</div><div>最長連續<br><b>${longestDays(tp,tid)}</b>天</div></div></div>
    <div class="note">點某一天，可以看當天做了哪些項目，也能補記。</div>
    <div class="lbl" style="margin-top:18px;color:var(--muted)">看更長的時間</div>
    <div class="seg" style="margin:0">${[['month','月'],['half','近半年'],['year','近一年']].map(([v,t]) => `<button class="${RV.range===v?'on':''}" onclick="RV.range='${v}';render()">${t}</button>`).join('')}</div>`;
  el.innerHTML = h;
}

function openDaySheet(k){
  const c = cat(RV.cat), d = pd(k);
  const hs = habitsOf(c.id, true).filter(h => !h.archived || isDone(h.id,k));
  openSheet(`<h2><span class="dot" style="background:${c.color}"></span>${md(d)}（${WD[d.getDay()]}）${esc(c.name)}</h2>
    ${hs.length ? `<div class="grid">${hs.map(x=>tile(x,k)).join('')}</div>` : '<p class="hint">這個類別目前沒有習慣。</p>'}
    <p class="hint" style="margin:12px 0">點一下就能補記或取消。</p>
    <button class="btn ghost" onclick="closeSheet()">完成</button>`);
}

/* =========================================================
   分頁 3：目標
   ========================================================= */
function renderGoals(){
  const t = today(), ws = weekStart(t);
  // 排序：先類別目標、再單一習慣目標，各自照類別順序
  const order = g => S.categories.findIndex(c => c.id === (g.type === 'cat' ? g.target : habit(g.target).catId));
  const goals = [...S.goals].sort((a,b) => (a.type === b.type ? 0 : a.type === 'cat' ? -1 : 1) || order(a) - order(b));
  const hit = goals.filter(g => goalCount(g) >= goalN(g)).length;
  let h = `<div class="eyebrow">本週 ${md(ws)} – ${md(addD(ws,6))}・${t.getMonth()+1} 月</div>
    <h1 class="title">我的目標</h1>
    <div class="subtitle">${goals.length ? `目前達標 <em>${hit}</em> / ${goals.length} 個目標` : '設定目標，讓自己有個方向'}</div>`;
  if (!goals.length) h += `<div class="card empty"><b>還沒有目標</b><p>可以替整個類別，或某一個習慣設定目標。</p></div>`;
  goals.forEach(g => {
    const color = goalColor(g), open = OPEN.goals.has(g.id), n = goalN(g), cnt = goalCount(g), p = goalPeriod(g);
    const pct = Math.min(100, Math.round(cnt/n*100));
    const sub = g.type === 'habit' ? `<small class="hint" style="font-weight:400">${esc(cat(habit(g.target).catId).name)}</small>` : '';
    let more = '';
    if (open) {
      // 每天、每週的目標：列出週一到週日；每月的目標：列出這個月每一天
      let strip;
      if (g.freq === 'monthly') {
        const off = (p.start.getDay()+6)%7;
        strip = `<div class="wk mo">${'<div></div>'.repeat(off)}${[...Array(p.days)].map((_,i) => { const d = addD(p.start,i), fut = d > t, on = !fut && doneOn(g.type,g.target,dk(d));
          return `<span class="${fut?'fut':''}" style="${on?`background:${color};color:${onColor(color)}`:''}">${i+1}</span>`; }).join('')}</div>`;
      } else {
        strip = `<div class="wk">${[...Array(7)].map((_,i) => { const d = addD(ws,i), fut = d > t, on = !fut && doneOn(g.type,g.target,dk(d));
          return `<div>${['一','二','三','四','五','六','日'][i]}<span class="${fut?'fut':''}" style="${on?`background:${color}`:''}"></span></div>`; }).join('')}</div>`;
      }
      const st = streakOf(g);
      more = `${strip}
        <div class="foot"><span>目標：${goalText(g)}${cnt < n ? `・還差 ${n-cnt} 次` : '・已達標'}</span>
        ${st ? `<span class="tag" style="background:${soft(color)};color:${ink(color)}">${st}</span>` : ''}</div>
        <div style="display:flex;justify-content:space-between;align-items:flex-end">
          <button class="add-line" onclick="openGoalSheet('${g.id}')">${ICON.target}調整目標</button>
          <button class="del-sm" onclick="removeGoal('${g.id}')">${ICON.trash}刪除</button></div>`;
    }
    h += `<div class="card"><button class="fold" onclick="toggleOpen('goals','${g.id}')">
      <div class="cat-h"><span class="dot" style="background:${color}"></span>${esc(goalName(g))}${sub}
      <span style="margin-left:auto;font-size:14px;color:${ink(color)};white-space:nowrap">${p.label} ${cnt} / ${n} 次</span>
      <span class="chev ${open?'up':''}">${ICON.down}</span></div>
      <div class="bar"><i style="width:${pct}%;background:${color}"></i></div></button>${more}</div>`;
  });
  if (S.categories.length) h += `<button class="btn ghost" style="background:#fff;margin-top:4px" onclick="openGoalSheet()">＋ 新增目標</button>`;
  if (goals.length) h += `<div class="note">同一天做了好幾個項目，只算 1 次。一週從週一算到週日。</div>`;
  document.getElementById('v-goals').innerHTML = h;
}

/* ---------- 新增／調整目標 ---------- */
let GS;
function openGoalSheet(gid){
  const g = gid ? S.goals.find(x => x.id === gid) : null;
  if (g) GS = { id:g.id, type:g.type, target:g.target, cat: g.type==='cat' ? g.target : habit(g.target).catId, freq:g.freq, wn: g.freq==='weekly'?g.n:3, mn: g.freq==='monthly'?g.n:10 };
  else { const c0 = S.categories.find(c => !goalOf('cat',c.id)) || S.categories[0];
    GS = { id:null, type:'cat', target:c0.id, cat:c0.id, freq:'weekly', wn:3, mn:10 }; }
  drawGoalSheet();
}
function drawGoalSheet(err){
  const color = cat(GS.cat).color, editing = !!GS.id;
  const sel = on => on ? `background:${soft(color)};border-color:${color};color:${ink(color)}` : '';
  const o = (v,t) => `<button class="opt ${GS.freq===v?'on':''}" style="--c:${color};${GS.freq===v?`background:${soft(color)};border-color:${color}`:''}" onclick="GS.freq='${v}';drawGoalSheet()"><span class="rd"></span>${t}</button>`;
  const stp = (k,max) => `<div class="stp"><button aria-label="減少" onclick="GS.${k}=Math.max(1,GS.${k}-1);drawGoalSheet()">${ICON.minus}</button><b>${GS[k]}</b>
      <button aria-label="增加" onclick="GS.${k}=Math.min(${max},GS.${k}+1);drawGoalSheet()">${ICON.plus}</button></div>`;
  const name = GS.type === 'cat' ? cat(GS.target).name : habit(GS.target).name;
  let who;
  if (editing) who = `<h2><span class="dot" style="background:${color}"></span>${esc(name)}的目標</h2>`;
  else {
    const hs = habitsOf(GS.cat);
    who = `<h2>新增目標</h2>
      <div class="lbl">要替誰設目標</div>
      <div class="chips">${S.categories.map(c => `<button class="chip" style="${sel(GS.cat===c.id)}" onclick="GS.cat='${c.id}';GS.type='cat';GS.target='${c.id}';drawGoalSheet()"><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</button>`).join('')}</div>
      <div class="chips" style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)">
        <button class="chip" style="${sel(GS.type==='cat')}" onclick="GS.type='cat';GS.target=GS.cat;drawGoalSheet()">整個類別</button>
        ${hs.map(x => `<button class="chip" style="${sel(GS.type==='habit'&&GS.target===x.id)}" onclick="GS.type='habit';GS.target='${x.id}';drawGoalSheet()">${esc(x.name)}</button>`).join('')}</div>
      <p class="hint" style="margin:6px 0 0">${GS.type==='cat' ? `「${esc(name)}」裡任一項目有做，就算 1 次` : `只算「${esc(name)}」這個習慣`}</p>
      <div class="lbl">多久一次</div>`;
  }
  openSheet(`${who}
    ${o('daily','每天')}
    ${o('weekly','每週幾次')}${GS.freq==='weekly' ? stp('wn',6) + `<p class="hint" style="text-align:center;margin:0 0 6px">一週有 ${GS.wn} 天做到就達標</p>` : ''}
    ${o('monthly','每月幾次')}${GS.freq==='monthly' ? stp('mn',31) + `<p class="hint" style="text-align:center;margin:0 0 6px">一個月有 ${GS.mn} 天做到就達標</p>` : ''}
    <div class="err">${err || ''}</div>
    <div class="btns" style="margin-top:14px"><button class="btn ghost" onclick="closeSheet()">取消</button><button class="btn" onclick="saveGoal()">${editing?'儲存':'加入目標'}</button></div>
    ${editing ? '<button class="btn danger" style="margin-top:8px" onclick="removeGoal()">刪除這個目標</button>' : ''}`);
}
function saveGoal(){
  const n = GS.freq === 'weekly' ? GS.wn : GS.freq === 'monthly' ? GS.mn : 7;
  if (!GS.id) {
    if (goalOf(GS.type, GS.target)) return drawGoalSheet('這個已經有目標了，請在目標清單裡點開它來調整');
    S.goals.push({ id:uid(), type:GS.type, target:GS.target, freq:GS.freq, n });
    toast('已加入目標');
  } else {
    Object.assign(S.goals.find(x => x.id === GS.id), { freq:GS.freq, n });
    toast('目標已更新');
  }
  save(); closeSheet(); render();
}
function removeGoal(gid){
  const id = gid || GS.id, g = S.goals.find(x => x.id === id);
  if (!confirm(`確定刪除「${goalName(g)}」的目標？\n打卡紀錄不會受影響。`)) return;
  S.goals = S.goals.filter(x => x.id !== id);
  save(); closeSheet(); render(); toast('已刪除目標');
}

/* =========================================================
   分頁 4：習慣（新增、改名、換類別、封存、備份）
   ========================================================= */
function renderHabits(){
  let h = `<h1 class="title" style="margin-top:6px">我的習慣</h1>`;
  S.categories.forEach(c => {
    const hs = habitsOf(c.id), open = OPEN.habits.has(c.id);
    // 收合時只顯示類別和習慣數量，點開才看到每個習慣
    h += `<div class="card"><button class="fold" onclick="toggleOpen('habits','${c.id}')"><div class="cat-h"><span class="dot" style="background:${c.color}"></span>${esc(c.name)}
      <span class="hint" style="margin-left:auto;font-weight:400">${hs.length} 個習慣</span><span class="chev ${open?'up':''}">${ICON.down}</span></div></button>
      ${open ? `<div style="margin-top:4px">${hs.map(x => `<button class="row" onclick="openHabitSheet('${x.id}')">${esc(x.name)}<span class="chev">${ICON.right}</span></button>`).join('')}</div>
      <div style="display:flex;justify-content:space-between"><button class="add-line" onclick="openHabitSheet(null,'${c.id}')">${ICON.plus}新增習慣</button>
      <button class="add-line" style="color:var(--muted)" onclick="openCatSheet('${c.id}')">${ICON.pen}編輯類別</button></div>` : ''}</div>`;
  });
  h += `<button class="btn ghost" style="background:#fff" onclick="openCatSheet()">＋ 新增類別</button>`;
  const arch = S.habits.filter(x => x.archived);
  if (arch.length) {
    h += `<div class="section-t">已封存</div><div class="card">${arch.map(x => { const c = cat(x.catId);
      return `<button class="row" onclick="openHabitSheet('${x.id}')"><span class="dot" style="background:${c.color}"></span>${esc(x.name)} <small>${esc(c.name)}</small><span class="chev">${ICON.right}</span></button>`; }).join('')}</div>`;
  }
  h += `<div class="section-t">資料備份</div>
    <div class="card"><p class="hint" style="margin:2px 0 10px">資料只存在這支手機上。建議每個月匯出一次備份；換手機或清除瀏覽器資料前，一定要先匯出。</p>
    <div class="btns"><button class="btn ghost" onclick="exportData()">匯出備份</button><button class="btn ghost" onclick="document.getElementById('importFile').click()">匯入備份</button></div></div>`;
  document.getElementById('v-habits').innerHTML = h;
}

/* ---------- 新增／編輯習慣 ---------- */
let HS;
function openHabitSheet(id, presetCat, keep){
  if (!keep) {
    const x = id ? habit(id) : null;
    HS = x ? { id:x.id, name:x.name, catId:x.catId, orig:x.catId } : { id:null, name:'', catId: presetCat || (S.categories[0]||{}).id || null };
  }
  drawHabitSheet();
}
function drawHabitSheet(err){
  const x = HS.id ? habit(HS.id) : null;
  const moved = x && HS.catId !== HS.orig;
  openSheet(`<h2>${x ? '編輯習慣' : '新增習慣'}</h2>
    <div class="lbl">習慣名稱</div>
    <input class="inp" id="hName" maxlength="20" placeholder="例如：游泳" value="${esc(HS.name)}" oninput="HS.name=this.value">
    ${x ? '<p class="hint" style="margin:6px 0 0">改名不會影響過去的打卡紀錄。如果想分開記錄，請用「新增習慣」。</p>' : ''}
    <div class="lbl">屬於哪個類別</div>
    <div class="chips">${S.categories.map(c => `<button class="chip" onclick="HS.catId='${c.id}';drawHabitSheet()"
      style="${HS.catId===c.id?`background:${soft(c.color)};border-color:${c.color};color:${ink(c.color)}`:''}"><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</button>`).join('')}
      <button class="chip new" onclick="openCatSheet(null,true)">＋ 新類別</button></div>
    ${moved ? '<div class="note">換類別後，這個習慣過去的打卡紀錄也會一起搬到新類別。</div>' : ''}
    <div class="err">${err || ''}</div>
    <button class="btn" style="margin-top:14px" onclick="saveHabit()">${x ? '儲存' : '加入'}</button>
    ${x ? `<div class="btns" style="margin-top:8px"><button class="btn ghost" onclick="archiveHabit()">${x.archived ? '恢復使用' : '封存（暫停不做）'}</button></div>
      <button class="btn danger" style="margin-top:6px" onclick="deleteHabit()">刪除這個習慣</button>` : ''}`);
  if (!x) setTimeout(() => { const i = document.getElementById('hName'); if (i && !HS.name) i.focus(); }, 260);
}
function saveHabit(){
  const name = HS.name.trim();
  if (!name) return drawHabitSheet('請輸入習慣名稱');
  if (!HS.catId || !cat(HS.catId)) return drawHabitSheet('請選一個類別，沒有的話先按「＋ 新類別」');
  if (S.habits.some(h => h.id !== HS.id && !h.archived && h.catId === HS.catId && h.name === name))
    return drawHabitSheet('這個類別裡已經有同名的習慣');
  if (HS.id) { const x = habit(HS.id); x.name = name; x.catId = HS.catId; toast('已儲存'); }
  else { S.habits.push({ id:uid(), name, catId:HS.catId, archived:false }); toast(`已加入「${name}」`); }
  save(); closeSheet(); render();
}
function archiveHabit(){
  const x = habit(HS.id); x.archived = !x.archived;
  save(); closeSheet(); render();
  toast(x.archived ? '已封存，打卡頁不再顯示，紀錄都還在' : '已恢復使用');
}
function deleteHabit(){
  const x = habit(HS.id);
  if (!confirm(`確定刪除「${x.name}」？\n\n這個習慣所有的打卡紀錄都會一起消失，無法復原。\n只是暫時不做的話，建議用「封存」。`)) return;
  S.habits = S.habits.filter(h => h.id !== x.id);
  S.goals = S.goals.filter(g => !(g.type === 'habit' && g.target === x.id));
  Object.keys(S.logs).forEach(k => { S.logs[k] = S.logs[k].filter(id => id !== x.id); if (!S.logs[k].length) delete S.logs[k]; });
  save(); closeSheet(); render(); toast('已刪除');
}

/* ---------- 新增／編輯類別 ---------- */
let CS;
function openCatSheet(id, fromHabit){
  const c = id ? cat(id) : null;
  const used = S.categories.map(x => x.color);
  CS = c ? { id:c.id, name:c.name, color:c.color, fromHabit } : { id:null, name:'', color: PALETTE.find(p => !used.includes(p)) || PALETTE[0], fromHabit };
  drawCatSheet();
}
function drawCatSheet(err){
  const c = CS.id ? cat(CS.id) : null;
  openSheet(`<h2>${c ? '編輯類別' : '新增類別'}</h2>
    <div class="lbl">類別名稱</div>
    <input class="inp" id="cName" maxlength="12" placeholder="例如：學語言" value="${esc(CS.name)}" oninput="CS.name=this.value">
    <div class="lbl">顏色</div>
    <div class="sw">${PALETTE.map(p => `<button aria-label="顏色 ${p}" class="${CS.color===p?'on':''}" style="background:${p};--c:${p}" onclick="CS.color='${p}';drawCatSheet()"></button>`).join('')}</div>
    ${c ? '' : '<p class="hint" style="margin:12px 0 0">建立後，可以到「目標」分頁新增目標。</p>'}
    <div class="err">${err || ''}</div>
    <div class="btns" style="margin-top:14px"><button class="btn ghost" onclick="${CS.fromHabit ? 'openHabitSheet(null,null,true)' : 'closeSheet()'}">${CS.fromHabit ? '返回' : '取消'}</button>
      <button class="btn" onclick="saveCat()">${c ? '儲存' : '建立類別'}</button></div>
    ${c ? '<button class="btn danger" style="margin-top:8px" onclick="deleteCat()">刪除這個類別</button>' : ''}`);
  if (!c) setTimeout(() => { const i = document.getElementById('cName'); if (i && !CS.name) i.focus(); }, 260);
}
function saveCat(){
  const name = CS.name.trim();
  if (!name) return drawCatSheet('請輸入類別名稱');
  if (S.categories.some(c => c.id !== CS.id && c.name === name)) return drawCatSheet('已經有同名的類別');
  if (CS.id) { const c = cat(CS.id); c.name = name; c.color = CS.color; }
  else { const id = uid(); S.categories.push({ id, name, color:CS.color }); CS.newId = id; }
  save();
  if (CS.fromHabit) { HS.catId = CS.newId || HS.catId; render(); openHabitSheet(null,null,true); return; }
  closeSheet(); render(); toast(CS.id ? '已儲存' : `已建立「${name}」`);
}
function deleteCat(){
  const c = cat(CS.id), n = habitsOf(c.id, true).length;
  if (n) return drawCatSheet(`這個類別還有 ${n} 個習慣（含封存）。請先把它們換到別的類別或刪除。`);
  if (!confirm(`確定刪除類別「${c.name}」？`)) return;
  S.categories = S.categories.filter(x => x.id !== c.id);
  S.goals = S.goals.filter(g => !(g.type === 'cat' && g.target === c.id));
  save(); closeSheet(); render(); toast('已刪除');
}

/* ---------- 備份 ---------- */
async function exportData(){
  const name = `習慣打卡備份-${dk(today())}.json`;
  const blob = new Blob([JSON.stringify(S, null, 1)], { type:'application/json' });
  try {
    const file = new File([blob], name, { type:'application/json' });
    if (navigator.canShare && navigator.canShare({ files:[file] })) { await navigator.share({ files:[file], title:name }); return; }
  } catch(e){ if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('備份檔已下載');
}
document.getElementById('importFile').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let d;
    try { d = migrate(JSON.parse(r.result)); if (!d.categories.length && !d.habits.length) throw 0; }
    catch(err){ alert('這個檔案看起來不是習慣打卡的備份檔，沒有匯入。'); return; }
    if (!confirm(`要用這份備份取代目前的資料嗎？\n\n備份內有 ${d.categories.length} 個類別、${d.habits.length} 個習慣、${Object.keys(d.logs).length} 天的紀錄。\n目前手機上的資料會被覆蓋。`)) return;
    S = d; save(); render(); toast('已匯入備份');
  };
  r.readAsText(f);
});

/* =========================================================
   共用：面板、提示、分頁切換
   ========================================================= */
function openSheet(html){
  document.getElementById('sheetBody').innerHTML = html;
  document.getElementById('mask').classList.add('on');
  document.getElementById('sheet').classList.add('on');
}
function closeSheet(){
  document.getElementById('mask').classList.remove('on');
  document.getElementById('sheet').classList.remove('on');
}
let toastT;
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200);
}
// 目標、習慣分頁裡，哪些類別目前是展開的
const OPEN = { goals:new Set(), habits:new Set() };
function toggleOpen(page, id){ OPEN[page].has(id) ? OPEN[page].delete(id) : OPEN[page].add(id); render(); }
let TAB = 'today';
function showTab(tab){
  TAB = tab;
  if (tab === 'today') viewDate = today();
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + tab));
  document.getElementById('fab').classList.toggle('hide', tab !== 'today');
  window.scrollTo(0,0);
  render();
}
// keepSheet：在面板裡打卡時，只更新背後的頁面，不關掉面板
function render(keepSheet){
  ({ today:renderToday, review:renderReview, goals:renderGoals, habits:renderHabits })[TAB]();
}

/* ---------- 啟動 ---------- */
S = load(); save();
document.querySelectorAll('[data-icon]').forEach(el => el.outerHTML = ICON[el.dataset.icon]);
document.getElementById('fab').innerHTML = ICON.plus;
render();
// 隔天打開時，自動換成新的一天
let lastDay = dk(today());
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && dk(today()) !== lastDay) { lastDay = dk(today()); viewDate = today(); render(); }
});
// 請瀏覽器盡量不要自動清掉資料
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
// 離線也能打開
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
